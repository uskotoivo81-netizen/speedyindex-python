[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speedyindex"
version = "0.2.0"
description = "Python client and CLI for the SpeedyIndex API: Google, Bing and Yandex index checks, link indexing, Google Rank Tracker and webhooks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "SpeedyIndex" }]
keywords = ["seo", "google index checker", "indexing", "backlinks", "speedyindex", "search console", "bing", "yandex", "rank tracker", "serp", "keyword position"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://en.speedyindex.com/"
Documentation = "https://en.speedyindex.com/api.php"
Source = "https://github.com/uskotoivo81-netizen/speedyindex-python"

[project.scripts]
speedyindex = "speedyindex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/speedyindex"]
